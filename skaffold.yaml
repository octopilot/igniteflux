# Octopilot shape source of truth (detect-contexts reads this).
# Run image first (docker artifact: ubuntu + git + kustomize), then the binary on top of it via the rust buildpack with
# runImage (the octopilot-pipeline-tools pattern), then the chart. Test leg: hack/test-unit.sh.
apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: igniteflux
build:
  artifacts:
    - image: igniteflux-base
      context: base
      docker:
        dockerfile: Dockerfile
    - image: ghcr.io/octopilot/igniteflux-chart
      context: chart/chartTemplate
      buildpacks:
        builder: ghcr.io/octopilot/builder-jammy-base:latest
    - image: ghcr.io/octopilot/igniteflux
      context: .
      buildpacks:
        builder: ghcr.io/octopilot/builder-jammy-base:latest   # rust-builder-d5eb42a carries octopilot/rust@0.1.6, which declares no launch processes
        runImage: ghcr.io/octopilot/igniteflux-base:latest
        env:
          - BP_RUST_BINARY_NAME=igniteflux
          - BP_TEST_COMMAND=./hack/test-unit.sh
          - BP_TEST_LABEL=unit
