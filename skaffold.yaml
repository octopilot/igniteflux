# builder-jammy-base tag must exist on GHCR; use a version tag for CI (e.g. 0.1.198).
apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: igniteflux
build:
  artifacts:
    - image: ghcr.io/octopilot/igniteflux
      context: .
      buildpacks:
        builder: ghcr.io/octopilot/builder-jammy-base:latest
    - image: ghcr.io/octopilot/igniteflux-chart
      context: chart/chartTemplate
      buildpacks:
        builder: ghcr.io/octopilot/builder-jammy-base:latest
