# Runs where the claims live (the cluster running Crossplane), under a ServiceAccount whose Workload Identity can describe
# and administer the target clusters. The App secret is delivered by external-secrets (or the bootstrap Job on a fresh cluster).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: igniteflux }
rules:
  - apiGroups: [platform.pricewhisperer.ai]          # the claim kinds in config; widen per target
    resources: ["*"]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [secrets, events]
    verbs: [get, list, watch, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: igniteflux }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: igniteflux }
subjects: [{ kind: ServiceAccount, name: provider-gcp, namespace: crossplane-system }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: igniteflux, namespace: crossplane-system }
data:
  config.yaml: |
    git: { repository: microscaler/gcp-infrastructure, branch: main, app_secret: igniteflux-github-app }
    targets:
      - { api_version: platform.pricewhisperer.ai/v1alpha1, kind: HubCluster, cluster: { provider: gke, project: =pw-ctl, location: =us-east4, name: =hub }, path: clusters/hub/flux-system }
      - { api_version: platform.pricewhisperer.ai/v1alpha1, kind: RuntimeEnvironment, cluster: { provider: gke, project: /spec/projectId, location: /spec/region, name: "=runtime-{env}" }, env_field: /spec/environment, path: clusters/runtime/{env}/flux-system }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: igniteflux, namespace: crossplane-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: igniteflux } }
  template:
    metadata: { labels: { app: igniteflux } }
    spec:
      serviceAccountName: provider-gcp
      containers:
        - name: igniteflux
          image: ghcr.io/octopilot/igniteflux:latest
          env:
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: RUST_LOG, value: info }
          volumeMounts:
            - { name: config, mountPath: /etc/igniteflux }
            - { name: work, mountPath: /var/lib/igniteflux }
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
      volumes:
        - { name: config, configMap: { name: igniteflux } }
        - { name: work, emptyDir: {} }
