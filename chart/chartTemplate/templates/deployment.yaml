apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "igniteflux.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: igniteflux }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: igniteflux } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: igniteflux }
      annotations: { checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }} }
    spec:
      serviceAccountName: {{ include "igniteflux.sa" . }}
      containers:
        - name: igniteflux
          image: {{ .Values.image.ref | default (printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: RUST_LOG, value: {{ .Values.logLevel | quote }} }
          volumeMounts:
            - { name: config, mountPath: /etc/igniteflux, readOnly: true }
            - { name: work, mountPath: /var/lib/igniteflux }
          resources: {{ toJson .Values.resources }}
      volumes:
        - { name: config, configMap: { name: {{ include "igniteflux.name" . }} } }
        - { name: work, emptyDir: {} }
