image:
  repository: ghcr.io/octopilot/igniteflux
  tag: ""            # defaults to the chart appVersion
  ref: ""            # full reference (repo:tag@digest) overriding repository/tag; CI passes the built image this way
  pullPolicy: IfNotPresent

# ServiceAccount to run as. On GKE this should carry the Workload Identity that may describe and administer the target clusters.
serviceAccount:
  create: false
  name: provider-gcp

# Secret (in the release namespace) with githubAppID, githubAppInstallationID, githubAppPrivateKey.
appSecret: igniteflux-github-app

config:
  git:
    repository: microscaler/gcp-infrastructure
    branch: main
  targets:
    - api_version: platform.pricewhisperer.ai/v1alpha1
      kind: HubCluster
      cluster: { provider: gke, project: =pw-ctl, location: =us-east4, name: =hub }
      path: clusters/hub/flux-system
    - api_version: platform.pricewhisperer.ai/v1alpha1
      kind: RuntimeEnvironment
      cluster: { provider: gke, project: /spec/projectId, location: /spec/region, name: "=runtime-{env}" }
      env_field: /spec/environment
      path: clusters/runtime/{env}/flux-system

# API groups of the claim kinds above; the ClusterRole is generated from this list (the probe group is added automatically).
claimApiGroups:
  - platform.pricewhisperer.ai

# The chart ships BootstrapProbe (crds/): a harmless kind the controller also watches, used by `helm test` and for
# smoke-checking a live install. Disable only if you want the controller to watch nothing but your own claims.
probe:
  enabled: true

tests:
  # kubectl-capable image for the Helm test pod
  image: alpine/k8s:1.33.1

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 256Mi }
logLevel: info
