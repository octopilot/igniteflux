# A harmless claim kind the controller watches so a Helm test (and an operator) can prove the reconciler works on any
# cluster without composing real infrastructure: a Ready probe pointing at a cluster that does not exist produces a
# BootstrapFailed event within seconds; nothing else happens.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bootstrapprobes.igniteflux.octopilot.io
spec:
  group: igniteflux.octopilot.io
  names: { kind: BootstrapProbe, plural: bootstrapprobes, singular: bootstrapprobe, shortNames: [bprobe] }
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                project: { type: string }
                location: { type: string }
                cluster: { type: string }
                path: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
