name: Octopilot CI

# Shared reusable pipeline (octopilot/actions); skaffold.yaml is the shape source of truth (detect-contexts reads it).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: octopilot-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Octopilot
    # The reusable pipeline pushes images (integration to ttl.sh / GHCR) and cuts releases; a caller must grant what nested jobs request.
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
    uses: octopilot/actions/.github/workflows/pipeline.yml@main
    with:
      integration: true
      integration_max_parallel: 4
      # op:latest until pipeline-tools restores the op:main tag (#40 dropped the alias its own CI relied on); then back to
      # main, and to a release tag once v1.1.3 exists.
      op_version: latest
