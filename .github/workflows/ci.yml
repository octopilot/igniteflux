name: Octopilot CI

# Shared reusable pipeline (octopilot/actions); skaffold.yaml is the shape source of truth (detect-contexts reads it).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: octopilot-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Octopilot
    # The reusable pipeline pushes images (integration to ttl.sh / GHCR) and cuts releases; a caller must grant what nested jobs request.
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
    uses: octopilot/actions/.github/workflows/pipeline.yml@main
    with:
      integration: true
      integration_max_parallel: 4
      # docker: artifacts need the Docker CLI in the op image (pipeline-tools#37, in op:main); drop once v1.1.3 is released.
      op_version: main
