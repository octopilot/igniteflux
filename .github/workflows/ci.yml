name: Octopilot CI

# Shared reusable pipeline (octopilot/actions); skaffold.yaml is the shape source of truth (detect-contexts reads it).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: octopilot-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Octopilot
    # The reusable pipeline pushes images (integration to ttl.sh / GHCR) and cuts releases; a caller must grant what nested jobs request.
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
    uses: octopilot/actions/.github/workflows/pipeline.yml@main
    with:
      integration: true
      integration_max_parallel: 4
      # op:latest, op:main, and op:v1.1.2 are different digests. Stay on latest until
      # pipeline-tools main is rebuilt from builder rust-builder-d741287 and op:main
      # moves; then pin main or the next release. See
      # octopilot-pipeline-tools/docs/image-launch-and-builder-tags.md.
      op_version: latest
