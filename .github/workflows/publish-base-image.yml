name: Publish base image

# Temporary, manual: publishes base/Dockerfile as ghcr.io/octopilot/igniteflux-base so the buildpack artifact has a
# runImage to build on. Goes away once the pipeline builds dependent artifacts in waves (actions#4, pipeline-tools#42).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: false
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: base
          file: base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/octopilot/igniteflux-base:${{ inputs.tag }}
            ghcr.io/octopilot/igniteflux-base:${{ github.sha }}
      - name: Verify
        run: docker run --rm --platform linux/amd64 ghcr.io/octopilot/igniteflux-base:${{ inputs.tag }} sh -c "echo \$PATH; git --version; kustomize version"
