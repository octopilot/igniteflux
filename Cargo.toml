[package]
name = "igniteflux"
version = "0.1.0"
edition = "2021"
description = "Bootstraps Flux into clusters that a Kubernetes claim says exist"
license = "Apache-2.0"
repository = "https://github.com/octopilot/igniteflux"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures = "0.3"
jsonwebtoken = "9"
k8s-openapi = { version = "0.24", features = ["latest"] }
kube = { version = "0.99", features = ["runtime", "client", "derive", "rustls-tls"], default-features = false }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
strip = true
lto = true
